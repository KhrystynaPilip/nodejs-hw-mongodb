tags:
  - Auth
summary: Reset password
operationId: resetPassword
description: Reset user password
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - password
          - token
        properties:
          password:
            type: string
            example: NewSecurePassword123
          token:
            type: string
            example: jwt.token.here
responses:
  '200':
    description: Password successfully reset
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password successfully reset!
            data:
              type: object
              example: {}
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: ../../components/responses/500.yaml
