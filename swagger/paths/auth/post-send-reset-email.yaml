tags:
  - Auth
summary: Send reset password email
operationId: requestResetEmail
description: Send reset password link to email
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            type: string
            format: email
            example: user@example.com
responses:
  '200':
    description: Email successfully sent
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email was successfully sent!
            data:
              type: object
              example: {}
  '404':
    $ref: '../../components/responses/404.yaml'
  '500':
    $ref: ../../components/responses/500.yaml
