tags:
  - Contacts
summary: Update contact by ID
operationId: updateContact
description: Partially update contact by ID. Allows updating fields and uploading a photo.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
    description: Unique identifier of the contact
requestBody:
  required: false
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: 'John Doe'
          email:
            type: string
            format: email
            example: 'john@example.com'
          phoneNumber:
            type: string
            example: '+123456789'
          contactType:
            type: string
            enum: [work, home, personal]
            example: work
          isFavourite:
            type: boolean
            example: true
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Contact successfully updated
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
